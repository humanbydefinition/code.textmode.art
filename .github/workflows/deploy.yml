name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report toolchain
        run: node --version && npm --version

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve IndexNow key from committed key file
        run: |
          KEY_FILE=$(grep -lE '^[A-Za-z0-9-]{8,128}$' public/*.txt 2>/dev/null | head -n1)
          if [ -z "$KEY_FILE" ]; then
            echo "::error::No IndexNow key file found in public/"
            exit 1
          fi
          echo "INDEXNOW_KEY=$(basename "$KEY_FILE" .txt)" >> "$GITHUB_ENV"

      - name: Submit recently modified docs to IndexNow
        env:
          INDEXNOW_HOST: code.textmode.art
        run: |
          npx --yes "indexnow-submitter@^1.5.0" submit-sitemap \
            https://code.textmode.art/sitemap.xml \
            --modified-since "$(date -u -d '2 days ago' +%F)"
