name: Dispatch contributor synchronization

on:
  push:
    branches: [main]
    paths:
      - .vitepress/data/contribution-types.json
      - .vitepress/data/contribution-types.schema.json
      - .vitepress/data/contributors.json
      - .vitepress/data/contributors.schema.json
      - scripts/contributors.mjs
      - .github/workflows/reconcile-contributors.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve targets without sending repository dispatch events
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  dispatch:
    if: vars.CONTRIBUTOR_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Resolve canonical source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create cross-repository GitHub App token
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CONTRIBUTOR_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTRIBUTOR_SYNC_APP_PRIVATE_KEY }}
          owner: humanbydefinition
          permission-contents: write
          repositories: |
            textmode.js-dev
            textmode.synth.js
            textmode.export.js
            textmode.figlet.js
            textmode.filters.js

      - name: Dispatch synchronization
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          for repository in \
            textmode.js-dev \
            textmode.synth.js \
            textmode.export.js \
            textmode.figlet.js \
            textmode.filters.js
          do
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/humanbydefinition/$repository/dispatches" \
              -f event_type=contributors-source-updated \
              -F "client_payload[source_sha]=$SOURCE_SHA" \
              -F "client_payload[schema_version]=1"
          done

      - name: Report dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          echo "Would dispatch code.textmode.art@${{ steps.source.outputs.sha }} to:"
          echo "textmode.js-dev textmode.synth.js textmode.export.js textmode.figlet.js textmode.filters.js"
