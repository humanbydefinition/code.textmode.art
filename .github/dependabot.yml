version: 2

updates:
    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: Europe/Berlin
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore
          include: scope
      ignore:
          # vitepress-plugin-mermaid@2.0.17 declares a peer of mermaid "10 || 11".
          # Hold major bumps until the plugin supports mermaid 12.
          - dependency-name: mermaid
            update-types:
                - version-update:semver-major
      groups:
          npm-development:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          npm-production:
              dependency-type: production
              update-types:
                  - minor
                  - patch
    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: '09:30'
          timezone: Europe/Berlin
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore
          include: scope
      groups:
          github-actions:
              patterns:
                  - '*'
